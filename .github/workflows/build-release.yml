name: Build & Release

on:
  push:
    tags:
      - "v[0-9]+"
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.2-alpha)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          BUILD_NUMBER=$((10#$MAJOR * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0}))
          DMG_NAME="Lumashot-darwin-arm64-${VERSION}.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve packages
        run: |
          xcodebuild \
            -project Lumashot.xcodeproj \
            -scheme Lumashot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          xcodebuild clean build \
            -project Lumashot.xcodeproj \
            -scheme Lumashot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          test -d "build/Build/Products/Release/Lumashot.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "Unexpected Sparkle SUFeedURL in built app"
            exit 1
          fi

      - name: Sign app with stable self-signed identity
        # A fixed certificate keeps the designated requirement stable across
        # versions, so the Screen Recording grant survives updates (an unsigned
        # build is treated by TCC as a new app every release). See scripts/sign-app.sh.
        env:
          SIGN_P12: ${{ secrets.LUMASHOT_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.LUMASHOT_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "::error::LUMASHOT_SIGN_P12 secret is missing; refusing to ship an unsigned build"
            exit 1
          fi
          KC="$RUNNER_TEMP/lumashot-sign.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          LUMASHOT_SIGN_KEYCHAIN="$KC" scripts/sign-app.sh "build/Build/Products/Release/Lumashot.app"

      - name: Package DMG
        run: |
          brew install create-dmg
          rm -rf /tmp/dmg-staging
          mkdir -p /tmp/dmg-staging
          cp -R "build/Build/Products/Release/Lumashot.app" /tmp/dmg-staging/
          create-dmg \
            --volname "Lumashot" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Lumashot.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            --hide-extension "Lumashot.app" \
            "$DMG_NAME" \
            /tmp/dmg-staging \
            || [ $? -eq 2 ]

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA256: $SHA256"

      - name: Extract release notes
        run: |
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            cat > release_notes.md <<EOF
          Lumashot ${VERSION} removes Sparkle hot updates and uses GitHub Releases for update prompts. When a newer version is detected, Lumashot opens the matching DMG download link for manual installation.
          EOF
          fi
          {
            echo ""
            echo "---"
            echo "SHA256: \`$SHA256\`"
          } >> release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" "$DMG_NAME" \
            --title "Lumashot v$VERSION" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG
