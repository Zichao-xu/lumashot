name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.2-alpha)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          BUILD_NUMBER=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          DMG_NAME="Lumashot-darwin-arm64-${VERSION}.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve packages
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          xcodebuild clean build \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          test -d "build/Build/Products/Release/Lumashot.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "build/Build/Products/Release/Lumashot.app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "Unexpected Sparkle SUFeedURL in built app"
            exit 1
          fi

      - name: Package DMG
        run: |
          brew install create-dmg
          rm -rf /tmp/dmg-staging
          mkdir -p /tmp/dmg-staging
          cp -R "build/Build/Products/Release/Lumashot.app" /tmp/dmg-staging/
          create-dmg \
            --volname "Lumashot" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Lumashot.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            --hide-extension "Lumashot.app" \
            "$DMG_NAME" \
            /tmp/dmg-staging \
            || [ $? -eq 2 ]

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA256: $SHA256"

      - name: Extract release notes
        run: |
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            cat > release_notes.md <<EOF
          Lumashot ${VERSION} removes Sparkle hot updates and uses GitHub Releases for update prompts. When a newer version is detected, Lumashot opens the matching DMG download link for manual installation.
          EOF
          fi
          {
            echo ""
            echo "---"
            echo "SHA256: \`$SHA256\`"
            echo ""
            echo "Note: This alpha DMG is built without Sparkle hot-update signing."
          } >> release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" "$DMG_NAME" \
            --title "Lumashot v$VERSION" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG
